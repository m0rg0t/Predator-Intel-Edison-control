name: Portable source regressions
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portable-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Run inert source regression tests
        run: node tests/light-announcements.test.cjs
